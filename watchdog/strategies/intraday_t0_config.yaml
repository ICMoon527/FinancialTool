# 分时做T策略配置文件
# 修改此文件可实时调整策略参数，无需修改代码

# 数据缓冲区配置
data:
  max_window: 200
  kline_freq: "1min"  # 可选: "1min" / "5min"

# 指标参数配置（分时适配）
indicators:
  # 主力吸筹
  absorption:
    llv_period: 60        # 日线38 → 增加周期过滤噪声
    hhv_period: 38
    var7_period: 90       # 日线90 → 更长EMA平滑
    filter_threshold: 0.5 # 日线1.01 → 提高阈值减少伪信号

  # 主力出货（吸筹公式的镜像，检测高位派发）
  distribution:
    llv_period: 30        # 与吸筹对称，使用相同周期
    hhv_period: 38
    var7_period: 90
    filter_threshold: 0.05

  # 主力进出
  main_in_out:
    hhv_llv_period: 10   # 日线30 → 分时10
    ema_period1: 2        # 日线3 → 分时2
    ema_period2: 3        # 日线5 → 分时3

  # CYW 主力控盘
  cyw:
    period: 5             # 日线10 → 分时5
    ma_period: 5

  # 量能
  volume:
    ma_period: 5
    surge_ratio: 1.5      # 放量阈值（成交量 / MA5）

  # 价格均线关系
  price_ma:
    ma5_period: 5         # 分时 MA5 周期
    ma20_period: 20       # 分时 MA20 周期

  # 均价偏离度
  avg_price_deviation:
    oversold_threshold: -2.5    # 超卖阈值（%）
    overbought_threshold: 2.5   # 超买阈值（%）

  # MACD
  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  # RSI
  rsi:
    period: 14
    overbought: 65
    oversold: 20

# 信号配置
signals:
  buy:
    thresholds:
      strong: 9   # 强买入 >= 10分
      medium: 7    # 中买入 >= 7分
      weak: 5      # 弱买入 >= 4分
    positions:
      strong: "全仓"
      medium: "半仓"
      weak: "1/3仓"
    confidence:
      strong: 0.85
      medium: 0.65
      weak: 0.40
    weights:
      absorption_active: 0   # 主力吸筹活跃
      cyw_cross_ma_up: 1     # CYW上穿MA
      main_in_signal: 1      # 主力进出金叉
      price_cross_ma5_up: 1  # 价格上穿MA5
      avg_price_oversold_fix: 2  # 均价超卖修复
      price_above_ma20: 1    # 价格>MA20趋势加成
      volume_surge: 1        # 量能放大
      macd_golden_cross: 2     # MACD金叉
      rsi_oversold: 5          # RSI超卖

  sell:
    thresholds:
      strong: 8   # 强卖出 >= 11分
      medium: 7    # 中卖出 >= 7分
      weak: 5      # 弱卖出 >= 4分
    positions:
      strong: "全仓卖出"
      medium: "半仓卖出"
      weak: "1/3仓卖出"
    confidence:
      strong: 0.85
      medium: 0.65
      weak: 0.40
    weights:
      distribution_active: 0        # 主力出货活跃
      main_out_signal: 0            # 主力进出死叉
      cyw_cross_ma_down: 0          # CYW下穿MA
      volume_stagnation: 3          # 放量滞涨
      price_cross_ma5_down: 2       # 价格下穿MA5
      avg_price_overbought_fix: 2   # 均价超买回落
      macd_death_cross: 2      # MACD死叉
      rsi_overbought: 5        # RSI超买

  # 引力场模型配置（连续化版本，暂时禁用）
  gravity:
    enabled: false                # 是否启用引力场评分修正，false 时不参与加减分
    weights:
      main_trading: 3              # 主力三线权重
      ma_line: 2                   # 均线权重
      extreme: 2                   # 极值权重
      chip_zone: 2                 # 筹码区权重
      prev_close: 1.5              # 昨收权重
    decay_sigma: 0.75              # 高斯衰减 σ（%），控制影响力随距离的衰减速度
    smooth_width: 0.20             # 穿越软化宽度（%），参考线附近支撑/压力的平滑过渡带
    max_adjustment: 2.0            # 引力场对评分的最大调整幅度（分）
    tanh_scale: 1.5                # tanh 缩放系数，控制净力到评分调整的灵敏度

# 运营参数
operation:
  signal_cooldown_bars: 0   # 同类型信号冷却K线数
  log_signals: false         # 是否日志输出信号