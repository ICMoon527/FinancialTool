# 分时做T策略配置文件
# 修改此文件可实时调整策略参数，无需修改代码

# 数据缓冲区配置
data:
  max_window: 200
  kline_freq: "1min"  # 可选: "1min" / "5min"

# 指标参数配置（分时适配）
indicators:
  # 主力吸筹
  absorption:
    llv_period: 60        # 日线38 → 增加周期过滤噪声
    hhv_period: 38
    var7_period: 90       # 日线90 → 更长EMA平滑
    filter_threshold: 0.5 # 日线1.01 → 提高阈值减少伪信号

  # 主力出货（吸筹公式的镜像，检测高位派发）
  distribution:
    llv_period: 30        # 与吸筹对称，使用相同周期
    hhv_period: 38
    var7_period: 90
    filter_threshold: 0.05

  # 量能
  volume:
    ma_period: 5
    surge_ratio: 1.5      # 放量阈值（成交量 / MA5）

  # 价格均线关系
  price_ma:
    ma5_period: 5         # 分时 MA5 周期
    ma20_period: 20       # 分时 MA20 周期

  # 均价偏离度
  avg_price_deviation:
    oversold_threshold: -2.5    # 超卖阈值（%）
    overbought_threshold: 2.5   # 超买阈值（%）

  # MACD
  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  # RSI
  rsi:
    period: 14
    overbought: 80
    oversold: 20

  # KDJ
  kdj:
    n_period: 9          # RSV 周期
    m1_period: 3         # K 值平滑周期
    m2_period: 3         # D 值平滑周期
    overbought: 80       # 超买阈值（K/D/J 均大于此值判定超买）
    oversold: 20         # 超卖阈值（K/D/J 均小于此值判定超卖）
    golden_cross_max: 50 # 低位金叉阈值（金叉时 K 值小于此值才视为低位有效买入信号）
    death_cross_min: 80  # 高位死叉阈值（死叉时 K 值大于此值才视为高位有效卖出信号）
    divergence_lookback: 10  # 顶底背离检测回看周期

  # MFI 资金流量指标（成交量加权的RSI）
  mfi:
    period: 6               # 计算周期，日内1分钟K线建议6-10
    overbought: 80          # 超买阈值
    oversold: 20            # 超卖阈值

# 信号配置
signals:
  buy:
    thresholds:
      strong: 100   # 强买入
      medium: 30    # 中买入
      weak: 10      # 弱买入
    positions:
      strong: "全仓"
      medium: "半仓"
      weak: "1/3仓"
    confidence:
      strong: 0.85
      medium: 0.65
      weak: 0.40
    weights:
      absorption_active: 0   # 主力吸筹活跃
      price_cross_ma5_up: 0  # 价格上穿MA5
      avg_price_oversold_fix: 0  # 均价超卖修复
      price_above_ma20: 0    # 价格>MA20趋势加成
      volume_surge: 0        # 量能放大
      macd_golden_cross: 0     # MACD金叉
      macd_bearish_recovering: 10   # MACD空头动能衰竭(买)
      rsi_oversold: 0          # RSI超卖
      kdj_oversold: 0          # KDJ超卖(K/D/J均<20)
      kdj_golden_cross: 0      # KDJ金叉(低位)
      mfi_oversold: 10           # MFI超卖
      mfi_cross_50_up: 0        # MFI上穿50线
      mfi_bottom_divergence: 0  # MFI底背离

  sell:
    thresholds:
      strong: 100   # 强卖出
      medium: 30    # 中卖出
      weak: 10      # 弱卖出
    positions:
      strong: "全仓卖出"
      medium: "半仓卖出"
      weak: "1/3仓卖出"
    confidence:
      strong: 0.85
      medium: 0.65
      weak: 0.40
    weights:
      distribution_active: 0        # 主力出货活跃
      volume_stagnation: 0          # 放量滞涨
      price_cross_ma5_down: 0       # 价格下穿MA5
      avg_price_overbought_fix: 0   # 均价超买回落
      macd_death_cross: 0      # MACD死叉
      macd_bullish_weakening: 10    # MACD多头动能衰减(卖)
      rsi_overbought: 0        # RSI超买
      kdj_overbought: 0        # KDJ超买(K/D/J均>80)
      kdj_death_cross: 0       # KDJ死叉(高位)
      mfi_overbought: 10         # MFI超买
      mfi_cross_50_down: 0      # MFI下穿50线
      mfi_top_divergence: 0     # MFI顶背离

  # 引力场模型配置（连续化版本，暂时禁用）
  gravity:
    enabled: false                # 是否启用引力场评分修正，false 时不参与加减分
    weights:
      main_trading: 3              # 主力三线权重
      ma_line: 2                   # 均线权重
      extreme: 2                   # 极值权重
      chip_zone: 2                 # 筹码区权重
      prev_close: 1.5              # 昨收权重
    decay_sigma: 0.75              # 高斯衰减 σ（%），控制影响力随距离的衰减速度
    smooth_width: 0.20             # 穿越软化宽度（%），参考线附近支撑/压力的平滑过渡带
    max_adjustment: 2.0            # 引力场对评分的最大调整幅度（分）
    tanh_scale: 1.5                # tanh 缩放系数，控制净力到评分调整的灵敏度

# 运营参数
operation:
  signal_cooldown_bars: 0   # 同类型信号冷却K线数
  log_signals: false         # 是否日志输出信号