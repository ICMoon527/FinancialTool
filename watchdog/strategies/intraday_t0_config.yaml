    enabled: false
    weights:
      main_trading: 3
      ma_line: 2
      extreme: 2
      chip_zone: 2
      prev_close: 1.5
    decay_sigma: 0.75
    smooth_width: 0.2
    max_adjustment: 2.0
    tanh_scale: 1.5
chart:
  reference_lines:
    attack_line: false
    trading_line: false
    defense_line: false
    ma_5: true
    ma_10: true
    ma_20: true
    expma_13: true
    previous_high_30: true
    previous_low_30: true
    chip_upper: true
    chip_lower: true
    prev_close: true
operation:
  signal_cooldown_bars: 0
  log_signals: false
