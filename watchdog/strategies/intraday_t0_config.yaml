data:
  max_window: 200
  kline_freq: 1min
indicators:
  absorption:
    llv_period: 60
    hhv_period: 38
    var7_period: 90
    filter_threshold: 0.5
  distribution:
    llv_period: 30
    hhv_period: 38
    var7_period: 90
    filter_threshold: 0.05
  volume:
    ma_period: 5
    surge_ratio: 1.5
  price_ma:
    ma5_period: 5
    ma20_period: 20
  avg_price_deviation:
    oversold_threshold: -2.5
    overbought_threshold: 2.5
  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9
  rsi:
    period: 14
    overbought: 80
    oversold: 20
  kdj:
    n_period: 9
    m1_period: 3
    m2_period: 3
    overbought: 80
    oversold: 20
    golden_cross_max: 50
    death_cross_min: 80
    divergence_lookback: 10
  mfi:
    period: 6
    overbought: 80
    oversold: 20
signals:
  buy:
    thresholds:
      strong: 100
      medium: 25
      weak: 10
    positions:
      strong: 全仓
      medium: 半仓
      weak: 1/3仓
    confidence:
      strong: 0.85
      medium: 0.65
      weak: 0.4
    weights:
      absorption_active: 0
      price_cross_ma5_up: 0
      avg_price_oversold_fix: 0
      price_above_ma20: 0
      volume_surge: 0
      macd_golden_cross: 0
      macd_bearish_recovering: 10
      rsi_oversold: 0
      kdj_oversold: 0
      kdj_golden_cross: 0
      mfi_oversold: 0
      mfi_cross_50_up: 0
      mfi_bottom_divergence: 0
  sell:
    thresholds:
      strong: 100
      medium: 25
      weak: 10
    positions:
      strong: 全仓卖出
      medium: 半仓卖出
      weak: 1/3仓卖出
    confidence:
      strong: 0.85
      medium: 0.65
      weak: 0.4
    weights:
      distribution_active: 0
      volume_stagnation: 0
      price_cross_ma5_down: 0
      avg_price_overbought_fix: 0
      macd_death_cross: 0
      macd_bullish_weakening: 10
      rsi_overbought: 0
      kdj_overbought: 0
      kdj_death_cross: 0
      mfi_overbought: 0
      mfi_cross_50_down: 0
      mfi_top_divergence: 0
