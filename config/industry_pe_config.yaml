# ============================================================
# 行业估值评分参考配置
# ============================================================
# 说明：
#   本文件用于基本面评分中的"估值合理性"维度评分。
#   评分逻辑：将股票当前 PE（市盈率）与行业合理 PE 区间比较，
#   PE 偏离合理区间越多，则扣分越多。
#
# 更新建议：
#   - 每季度根据市场整体估值水平调整一次
#   - 牛市可适当上调区间上限，熊市可适当下调
#   - 参考数据来源：中证指数官网、同花顺行业板块估值
#
# 格式说明：
#   pe_ranges 下的每个行业对应一个 [下限PE, 上限PE] 区间。
#   当 PE < 下限PE → 偏低估（可能加分或适中）
#   当 下限PE ≤ PE ≤ 上限PE → 合理估值（满分）
#   当 PE > 上限PE → 偏高估（扣分）
# ============================================================

pe_ranges:
  # 消费/品牌（白酒、食品饮料、家电、服装等）
  # 品牌溢价和护城河支持较高 PE
  消费: [15, 40]

  # 医药生物（化学制药、中药、医疗器械等）
  # 增长确定性强，PE 容忍度较高
  医药: [20, 50]

  # TMT/科技（电子、计算机、半导体等）
  # 高增长预期驱动高估值
  科技: [20, 60]

  # 制造/工业（机械设备、电力设备、军工等）
  # 传统制造业 PE 偏低
  制造: [10, 30]

  # 资源/周期（煤炭、钢铁、有色、化工等）
  # 强周期属性，PE 在景气高点反而低
  资源: [8, 25]

  # 金融（银行、证券、保险等）
  # 低估值板块
  金融: [5, 15]

  # 地产/基建（房地产开发、建筑装饰等）
  # 低估值板块，受政策影响大
  地产: [5, 15]

  # 公用事业（电力、燃气、水务等）
  # 稳定低增长，PE 偏低
  公用事业: [10, 25]

  # 无法识别的行业
  # 保守取中间值
  未知: [10, 30]