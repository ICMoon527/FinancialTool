# ============================================================
# 行业分位数阈值 & 合理 PE 区间配置
# ============================================================
#
# 评分系统中所有比率型指标的行业基准阈值，用户可手动更新。
#
# 【分位数格式】
#   每个指标是一个 [P25, P50, P75] 数组：
#     P25 - 第 25 百分位（行业中下分界线）
#     P50 - 第 50 百分位（行业中位数）
#     P75 - 第 75 百分位（行业中上分界线）
#
#   评分逻辑（以 higher_better=True 为例）：
#     值 >= P75 → 满分
#     P50 <= 值 < P75 → 80% 分
#     P25 <= 值 < P50 → 50% 分
#     值 < P25 → 20% 分
#   higher_better=False 的指标方向相反。
#
# 【pe_range 格式】
#   [下限PE, 上限PE] - 该行业合理 PE 估值区间
#   用于"估值合理性"维度评分，取区间中值为行业平均 PE。
#   建议每季度根据市场整体估值水平调整一次。
#   参考数据来源：中证指数官网、同花顺行业板块估值
#
# 更新方式：直接修改本文件中的数值后保存即可，
# 下次评分时自动加载最新配置。
# ============================================================

